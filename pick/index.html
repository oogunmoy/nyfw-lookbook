<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-fg: #ffffff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cp-bg); color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 24px 72px; }

/* ---------- masthead ---------- */
.masthead { padding: 54px 0 26px; }
.eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: .3em;
  text-transform: uppercase; color: var(--cp-accent); margin-bottom: 16px;
}
.masthead h1 {
  margin: 0; font-size: clamp(32px, 5.6vw, 56px);
  font-weight: 300; letter-spacing: -.02em; line-height: 1.04;
}
.masthead h1 b {
  display: block; font-weight: 500; font-style: italic;
  font-size: .42em; letter-spacing: .01em; margin-top: .3em;
  color: var(--cp-text-soft);
}
.slugline {
  margin-top: 22px; font-size: 13px; letter-spacing: .04em;
  color: var(--cp-text-muted);
}
.slugline b { font-weight: 700; color: var(--cp-text); }

/* ---------- stage ---------- */
.stagewrap { margin-top: 30px; }
.stage {
  position: relative; width: 100%; max-width: 700px; margin: 0 auto;
  aspect-ratio: 100 / 104;
}
.piece {
  position: absolute; cursor: zoom-in;
  transition: transform .25s ease, opacity .45s ease;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.10)) drop-shadow(0 20px 30px rgba(0,0,0,.20));
}
.piece:hover { transform: scale(1.035); }
.piece img { width: 100%; height: 100%; object-fit: fill; display: block; }
.piece.istile { filter: none; }
.piece.istile img {
  border-radius: 10px; object-fit: cover;
  box-shadow: 0 2px 5px rgba(0,0,0,.13), 0 12px 24px rgba(0,0,0,.14);
}

/* the two swappable pieces live in the DOM together and cross-fade */
.piece.opt { opacity: 0; pointer-events: none; }
.stage.showA .piece.optA,
.stage.showB .piece.optB { opacity: 1; pointer-events: auto; }

/* build-in: pieces land one at a time on first paint */
@keyframes land {
  from { opacity: 0; transform: translateY(14px) scale(.94); }
  to   { opacity: 1; transform: none; }
}
.stage.building .piece { opacity: 0; }
.stage.building .piece.lands {
  animation: land .62s cubic-bezier(.22,.85,.3,1) both;
  animation-delay: calc(var(--i) * 210ms);
}
.stage.building .piece.opt { animation: none; opacity: 0; }
.stage.building.showA .piece.optA,
.stage.building.showB .piece.optB {
  animation: land .62s cubic-bezier(.22,.85,.3,1) both;
  animation-delay: calc(var(--i) * 210ms);
}

/* ---------- A / B switch ---------- */
.switch {
  display: flex; gap: 14px; justify-content: center;
  margin: 34px auto 0; max-width: 700px;
}
.optbtn {
  flex: 1; min-width: 0; cursor: pointer;
  background: var(--cp-bg-elevated); color: var(--cp-text);
  border: 1px solid var(--cp-border); border-radius: 14px;
  padding: 16px 18px; text-align: left;
  font-family: inherit; transition: all .2s ease;
}
.optbtn:hover { border-color: var(--cp-border-strong); transform: translateY(-1px); }
.optbtn .oletter {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 999px;
  border: 1px solid var(--cp-border-strong); color: var(--cp-text-soft);
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  margin-bottom: 10px; transition: all .2s ease;
}
.optbtn .otitle {
  font-size: 14px; font-weight: 700; line-height: 1.3; letter-spacing: .01em;
}
.optbtn .osub {
  margin-top: 4px; font-size: 12px; color: var(--cp-text-muted); line-height: 1.35;
}
.stage-is-A .optbtn[data-opt="A"],
.stage-is-B .optbtn[data-opt="B"] {
  border-color: var(--cp-accent); background: var(--cp-surface);
  box-shadow: 0 8px 22px rgba(177,31,75,.12);
}
.stage-is-A .optbtn[data-opt="A"] .oletter,
.stage-is-B .optbtn[data-opt="B"] .oletter {
  background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg);
}

/* ---------- credits ---------- */
.keyrow {
  display: flex; flex-wrap: wrap; gap: 22px 40px;
  max-width: 860px; margin: 40px auto 0;
  padding-top: 24px; border-top: 1px solid var(--cp-border);
}
.keyitem { display: flex; flex-direction: column; gap: 2px; min-width: 140px; max-width: 210px; }
.keyitem.kopt { display: none; }
.is-A .keyitem.koptA, .is-B .keyitem.koptB { display: flex; }
.kcat {
  font-size: 9px; font-weight: 700; letter-spacing: .2em;
  text-transform: uppercase; color: var(--cp-text-soft); margin-bottom: 2px;
}
.kcat em {
  font-style: normal; color: var(--cp-accent); letter-spacing: .12em;
}
.kbrand { font-size: 13px; font-weight: 700; letter-spacing: .01em; line-height: 1.3; }
.kname { font-size: 12px; color: var(--cp-text-muted); line-height: 1.35; }
.kcolor {
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--cp-text-soft); display: flex; align-items: center; gap: 5px; margin-top: 3px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--cp-border-strong); flex: none; }

/* ---------- footer prompt ---------- */
.prompt {
  max-width: 860px; margin: 44px auto 0; padding-top: 26px;
  border-top: 1px solid var(--cp-border); text-align: center;
}
.prompt .big {
  font-size: clamp(20px, 3vw, 27px); font-weight: 300; letter-spacing: -.01em;
}
.prompt .small {
  margin-top: 10px; font-size: 12px; letter-spacing: .05em; color: var(--cp-text-soft);
}
.replay {
  margin-top: 22px; cursor: pointer; font-family: inherit;
  background: none; border: 1px solid var(--cp-border); border-radius: 999px;
  padding: 8px 18px; font-size: 11px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--cp-text-soft);
  transition: all .2s ease;
}
.replay:hover { border-color: var(--cp-border-strong); color: var(--cp-text); }

/* ---------- lightbox ---------- */
.lb {
  position: fixed; inset: 0; z-index: 90; display: none;
  align-items: center; justify-content: center;
  background: rgba(20,18,16,.86); padding: 40px; cursor: zoom-out;
}
.lb.on { display: flex; }
.lb img { max-width: 92vw; max-height: 82vh; }
.lb .cap {
  position: absolute; bottom: 26px; left: 0; right: 0; text-align: center;
  color: #fff; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
}

@media (max-width: 620px) {
  .wrap { padding: 0 16px 56px; }
  .masthead { padding: 34px 0 18px; }
  .switch { flex-direction: column; gap: 10px; }
  .optbtn { padding: 13px 15px; }
  .optbtn .oletter { margin-bottom: 7px; }
}
</style>
</head>

  const m = MASK[key];
  if (m) {
    img.style.webkitMaskImage = "url(" + m + ")";
    img.style.maskImage = "url(" + m + ")";

    img.style.maskSize = "100% 100%";
    img.style.webkitMaskRepeat = "no-repeat";
    img.style.maskRepeat = "no-repeat";
  }
  return img;
}

/* ---------- layout ---------- */

const STAGE_RATIO = 1.04;

const SLOTS = {
  top:        { l: 32, t:  2, w: 36, h: 49, z: 3 },
  trousers:   { l: 34, t: 46, w: 32, h: 50, z: 4 },
  bodysuit:   { l:  3, t:  3, w: 27, h: 36, z: 3 },
  necklace:   { l:  2, t:  2, w: 37, h: 34, z: 5 },
  earrings:   { l: 70, t:  7, w: 23, h: 26, z: 5 },
  sunglasses: { l: 70, t:  3, w: 25, h: 16, z: 5 },
  bracelet:   { l: 70, t: 21, w: 25, h: 17, z: 5 },
  bag:        { l:  2, t: 43, w: 27, h: 32, z: 6 },
  shoes:      { l: 64, t: 55, w: 32, h: 38, z: 6 }
};

const SLOT_MATCH = [
  [["bottom", "trouser", "pant", "culotte", "short"], "trousers"],
  [["bodysuit", "body"],                              "bodysuit"],
  [["top", "halter"],                                 "top"],
  [["necklace", "choker"],                            "necklace"],
  [["earring"],                                       "earrings"],
  [["sunglass"],                                      "sunglasses"],
  [["bracelet", "bangle", "cuff"],                    "bracelet"],
  [["bag", "purse", "clutch"],                        "bag"],
  [["shoe", "boot", "sandal", "heel"],                "shoes"]
];

function slotFor(cat) {
  const c = String(cat || "").toLowerCase();
  for (const [keys, slot] of SLOT_MATCH) if (keys.some(k => c.includes(k))) return slot;
  return "bracelet";
}

// Accessories share the two side columns; more than one in a column stacks down it.
const COLUMNS = [
  { members: ["necklace", "bodysuit"],                          l: 2,  t: 2, w: 28, bottom: 40 },
  { members: ["earrings", "sunglasses", "bracelet"],             l: 69, t: 2, w: 27, bottom: 53 }
];

function columnRects(items) {
  const rects = new Map();
  const names = items.map(it => slotFor(it.cat));
  COLUMNS.forEach(col => {
    const idx = [];
    names.forEach((nm, i) => { if (col.members.indexOf(nm) !== -1) idx.push(i); });
    if (idx.length < 2) return;                 // a single item keeps its designed slot
    const span = col.bottom - col.t;
    const gap = Math.min(4, span * 0.05);
    const h = (span - gap * (idx.length - 1)) / idx.length;
    idx.forEach((itemIdx, k) => {
      rects.set(itemIdx, { l: col.l, t: col.t + k * (h + gap), w: col.w, h: h, z: 5 });
    });
  });
  return rects;
}

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

function makePiece(item, slot) {
  const isTile = CUT[item.img] === false;
  const p = el("div", "piece" + (isTile ? " istile" : ""));
  // Box matches the image's own aspect so the alpha mask lines up exactly.
  const ar = AR[item.img] || 1.33;
  const pw = Math.min(slot.w, slot.h * STAGE_RATIO / ar);
  const ph = pw * ar / STAGE_RATIO;
  p.style.width  = pw.toFixed(2) + "%";
  p.style.height = ph.toFixed(2) + "%";
  p.style.left   = (slot.l + (slot.w - pw) / 2).toFixed(2) + "%";
  p.style.top    = slot.t.toFixed(2) + "%";
  p.style.zIndex = String(slot.z);
  p.title = item.brand + " \u2014 " + item.name;
  const img = el("img");
  paint(img, item.img);
  img.alt = item.brand + " " + item.name;
  p.appendChild(img);
  p.addEventListener("click", () => openLightbox(img.src, item.brand + " \u2014 " + item.name));
  return p;
}

function creditItem(item, optLetter) {
  const k = el("div", "keyitem" + (optLetter ? " kopt kopt" + optLetter : ""));
  const label = optLetter ? esc(item.cat) + " <em>\u00b7 " + optLetter + "</em>" : esc(item.cat);
  k.appendChild(el("div", "kcat", label));
  k.appendChild(el("div", "kbrand", esc(item.brand)));
  k.appendChild(el("div", "kname", esc(item.name)));
  if (item.color) {
    const c = el("div", "kcolor");
    const d = el("i", "dot");
    d.style.background = item.hex;
    c.appendChild(d);
    c.appendChild(el("span", null, esc(item.color)));
    k.appendChild(c);
  }
  return k;
}

/* ---------- render ---------- */

const stage  = document.getElementById("stage");
const keyrow = document.getElementById("keyrow");

function render() {
  stage.innerHTML = "";
  keyrow.innerHTML = "";

  // Column stacking only depends on the locked accessories, so the two options
  // never shift anything else on the stage - only the two slots in question change.
  const rects = columnRects(LOCKED);

  LOCKED.forEach((item, i) => {
    const name = slotFor(item.cat);
    const slot = Object.assign({}, SLOTS[name], rects.get(i) || {});
    const p = makePiece(item, slot);
    p.classList.add("lands");
    p.style.setProperty("--i", String(i));
    stage.appendChild(p);
    keyrow.appendChild(creditItem(item));
  });

  // Both options are placed at once and cross-faded, so switching never re-lays out.
  ["A", "B"].forEach(letter => {
    OPTIONS[letter].forEach((item, j) => {
      const slot = SLOTS[slotFor(item.cat)];
      const p = makePiece(item, slot);
      p.classList.add("opt", "opt" + letter);
      p.style.setProperty("--i", String(LOCKED.length + j));
      stage.appendChild(p);
      keyrow.appendChild(creditItem(item, letter));
    });
  });
}

function setOpt(letter) {
  stage.classList.toggle("showA", letter === "A");
  stage.classList.toggle("showB", letter === "B");
  document.body.classList.toggle("stage-is-A", letter === "A");
  document.body.classList.toggle("stage-is-B", letter === "B");
  keyrow.classList.toggle("is-A", letter === "A");
  keyrow.classList.toggle("is-B", letter === "B");
  history.replaceState(null, "", "#" + letter.toLowerCase());
}

function playBuild() {
  stage.classList.remove("building");
  void stage.offsetWidth;               // restart the animation
  stage.classList.add("building");
  const total = (LOCKED.length + 2) * 210 + 700;
  setTimeout(() => stage.classList.remove("building"), total);
}

/* ---------- lightbox ---------- */
const lb = document.getElementById("lb");
function openLightbox(src, cap) {
  document.getElementById("lbimg").src = src;
  document.getElementById("lbcap").textContent = cap;
  lb.classList.add("on");
}
lb.addEventListener("click", () => lb.classList.remove("on"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") lb.classList.remove("on");
  if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft")  setOpt("A");
  if (e.key === "b" || e.key === "B" || e.key === "ArrowRight") setOpt("B");
});

document.getElementById("switch").addEventListener("click", e => {
  const btn = e.target.closest(".optbtn");
  if (btn) setOpt(btn.dataset.opt);
});
document.getElementById("replay").addEventListener("click", playBuild);

render();
setOpt(location.hash.toLowerCase() === "#b" ? "B" : "A");
playBuild();
</script>
</body>
</html>
